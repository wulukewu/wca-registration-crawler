name: WCA Runner

on:
  workflow_dispatch:
    inputs:
      event_url:
        description: 'Specific Cubing-TW competition URL (/event/<event>)'
        type: string
        required: true
      events:
        description: 'WCA event IDs: all, 333, 333,222,... (see README)'
        type: string
        required: true
        default: 'all'
      runner_count:
        description: 'Readiness workers (only one is allowed to submit)'
        type: choice
        options: ['1', '2', '3', '4', '5']
        default: '1'
        required: true
      dry_run:
        description: 'Test through preview only; never submit'
        type: boolean
        default: true
        required: true
      wait_minutes:
        description: 'Stop waiting for registration to open after'
        type: choice
        options: ['15', '30', '60', '120', '180', '240', '300']
        default: '60'
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: wca-registration
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runners: ${{ steps.select.outputs.runners }}
    steps:
      - name: Build requested worker matrix
        id: select
        env:
          COUNT: ${{ inputs.runner_count }}
        run: |
          case "$COUNT" in 1|2|3|4|5) ;; *) echo 'Invalid runner count' >&2; exit 1 ;; esac
          echo "runners=[$(seq -s, 1 "$COUNT")]" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
      - name: Announce registration watcher start (best effort)
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 notification_report.py start

  register:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner_index: ${{ fromJSON(needs.prepare.outputs.runners) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required only for an atomic, run-scoped registration claim
      packages: read
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image built from the exact selected commit
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: docker pull "$IMAGE"
      - name: Run crawler
        env:
          EVENT_URL: ${{ inputs.event_url }}
          EVENTS: ${{ inputs.events }}
          DRY_RUN: ${{ inputs.dry_run }}
          WAIT_MINUTES: ${{ inputs.wait_minutes }}
          HEADLESS: 'true'
          RUNNER_COUNT: ${{ inputs.runner_count }}
          RUNNER_INDEX: ${{ matrix.runner_index }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          WCA_ID: ${{ secrets.WCA_ID }}
          BIRTHDAY_YEAR: ${{ secrets.BIRTHDAY_YEAR }}
          BIRTHDAY_MONTH: ${{ secrets.BIRTHDAY_MONTH }}
          BIRTHDAY_DAY: ${{ secrets.BIRTHDAY_DAY }}
          EMAIL: ${{ secrets.EMAIL }}
          PHONE: ${{ secrets.PHONE }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/wca-result"
          docker run --rm \
            -v "$RUNNER_TEMP/wca-result:/result" \
            -e RESULT_PATH=/result/run-result.json \
            -e EVENT_URL -e EVENTS -e DRY_RUN -e WAIT_MINUTES -e HEADLESS \
            -e RUNNER_COUNT -e RUNNER_INDEX -e GITHUB_TOKEN -e GITHUB_SHA \
            -e WCA_ID -e BIRTHDAY_YEAR -e BIRTHDAY_MONTH -e BIRTHDAY_DAY \
            -e EMAIL -e PHONE -e DISCORD_TOKEN -e DISCORD_CHANNEL_ID \
            -e GITHUB_RUN_ID -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL \
            "$IMAGE"
      - name: Publish diagnostic result
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/wca-result/run-result.json"; then
            cp "$RUNNER_TEMP/wca-result/run-result.json" ./run-result.json
            echo '### WCA runner outcome' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat ./run-result.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Crawler did not start or did not produce a result (infrastructure failure).' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registration-diagnostics-${{ matrix.runner_index }}
          path: run-result.json
          if-no-files-found: ignore
          retention-days: 7

  cleanup:
    needs: [prepare, register]
    if: ${{ always() && needs.prepare.result == 'success' && inputs.runner_count != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Remove run-scoped submission claim
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner, repo: context.repo.repo,
                ref: 'heads/wca-registration-claim-' + context.runId
              });
              core.info('Removed run-scoped submission claim.');
            } catch (error) {
              // GitHub returns 422 (not 404) when deleting a missing ref.
              // No claim is created if registration never opens, which is expected.
              const missingRef = error.status === 404 ||
                (error.status === 422 &&
                 error.response?.data?.message === 'Reference does not exist');
              if (!missingRef) throw error;
              core.info('No submission claim to remove; cleanup complete.');
            }
